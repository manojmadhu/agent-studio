# Alembic config. The database URL is NOT set here: migrations/env.py reads DI_DATABASE_URL via app.config.
#   cd backend && . .venv/bin/activate
#   alembic upgrade head                       # online, uses DI_DATABASE_URL
#   alembic upgrade head --sql > out.sql       # offline DDL for the dialect of DI_DATABASE_URL
#   alembic revision --autogenerate -m "..."   # then hand-review for MSSQL (see docs/database.md)
[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
truncate_slug_length = 40
path_separator = os
output_encoding = utf-8

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = logging.StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
